name: win11_pc_launcher
description: A customization launcher inspired by desktop interfaces.
publish_to: 'none'

version: 1.5.0+4

environment:
  sdk: '^3.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  installed_apps: ^2.1.1
  volume_controller: ^3.6.1
  screen_brightness: ^2.1.11
  app_settings: ^9.0.0             
  image_picker: ^1.2.3
  shared_preferences: ^2.5.5
  torch_light: ^2.0.0              
  provider: ^6.1.1 
  cached_network_image: ^4.0.4
  flutter_inappwebview: ^6.0.0
  path_provider: ^2.1.2
  permission_handler: 11.3.1
  device_info_plus: ^10.1.2        
  package_info_plus: ^9.0.0       
  device_calendar: ^4.3.3
  timezone: ^0.9.2
  http: ^1.2.0
  geolocator: ^14.0.2
  flutter_secure_storage: ^10.3.4
  crypto: ^3.0.3
  archive: ^4.2.0
  new_version_plus: ^1.0.1         
  confetti: ^0.8.0
  dynamic_color: ^2.1.0
  local_auth: ^3.0.2
  xml: ^7.1.0
  google_sign_in: ^6.2.1
  googleapis: ^13.1.0
  extension_google_sign_in_as_googleapis_auth: ^2.0.7
  in_app_purchase: ^3.1.13

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  rename: ^3.1.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/wallpapers/
    - assets/sounds/
  
flutter_launcher_icons:
  android: true
  ios: false 
  image_path: "assets/icon.png"
  adaptive_icon_background: "#1F1F1F"
  adaptive_icon_foreground: "assets/icon.png"